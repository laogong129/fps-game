<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPS 幸存者围城</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; }
      #game-canvas { display: block; }
      .overlay {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center;
        flex-direction: column; gap: 16px;
        background: rgba(10, 10, 20, 0.85);
        color: #fff; z-index: 10;
      }
      .overlay.show { display: flex; }
      .overlay h1 { font-size: 42px; letter-spacing: 4px; }
      .overlay .hint { color: #999; font-size: 14px; line-height: 1.8; text-align: center; }
      .overlay .stats { font-size: 18px; line-height: 1.8; color: #ccc; }
      .btn {
        padding: 12px 48px; font-size: 18px; cursor: pointer;
        background: #3a7afe; color: #fff; border: none; border-radius: 6px;
      }
      .btn:hover { background: #5a91ff; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; color: #fff; }
      .hud-panel {
        position: absolute; background: rgba(0,0,0,0.4);
        border-radius: 8px; padding: 10px 14px; backdrop-filter: blur(4px);
      }
      #hud-stats { left: 16px; top: 16px; font-size: 14px; line-height: 1.7; }
      #hud-weapon { right: 16px; bottom: 16px; font-size: 22px; font-weight: bold; }
      #hud-ammo { right: 16px; bottom: 54px; font-size: 13px; color: #aaa; }
      .bar { width: 200px; height: 10px; background: rgba(255,255,255,0.15); border-radius: 5px; overflow: hidden; margin-top: 4px; }
      .bar-fill { height: 100%; border-radius: 5px; transition: width 0.2s; }
      #hp-fill { background: #e74c3c; }
      #xp-fill { background: #f1c40f; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        z-index: 4; pointer-events: none; color: rgba(255,255,255,0.85); font-size: 20px;
      }
      #levelup {
        position: fixed; inset: 0; z-index: 8;
        display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.5);
      }
      #levelup.show { display: flex; }
      #levelup-inner { text-align: center; color: #fff; }
      #levelup-inner h2 { font-size: 30px; margin-bottom: 20px; color: #f1c40f; }
      .choice {
        display: inline-block; width: 180px; margin: 10px; padding: 18px;
        background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2);
        border-radius: 10px; cursor: pointer; font-size: 15px;
      }
      .choice:hover { background: rgba(255,255,255,0.18); border-color: #f1c40f; }
    </style>
  </head>
  <body>
    <div id="game-canvas"></div>

    <div class="overlay show" id="start-screen">
      <h1>FPS 幸存者围城</h1>
      <div class="hint">
        WASD 移动 &nbsp;|&nbsp; Shift 冲刺 &nbsp;|&nbsp; 鼠标瞄准 &nbsp;|&nbsp; 左键射击 &nbsp;|&nbsp; R 换弹<br>
        击杀敌人获得经验，升级三选一，能撑多久？
      </div>
      <button class="btn" id="start-btn">开始游戏</button>
    </div>

    <div class="overlay" id="gameover-screen">
      <h1>阵亡</h1>
      <div class="stats" id="gameover-stats"></div>
      <button class="btn" id="restart-btn">再来一局（Enter）</button>
    </div>

    <div id="hud">
      <div class="hud-panel" id="hud-stats">
        波次 <b id="hud-wave">1</b> &nbsp; 击杀 <b id="hud-kills">0</b><br>
        生命 <b id="hp-num">100/100</b>
        <div class="bar"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
        经验 Lv.<b id="hud-level">1</b> <b id="xp-num">0/10</b>
        <div class="bar"><div class="bar-fill" id="xp-fill" style="width:0%"></div></div>
      </div>
      <div class="hud-panel" id="hud-ammo">换弹中…</div>
      <div class="hud-panel" id="hud-weapon">8 / 5</div>
      <div id="crosshair">+</div>
    </div>

    <div id="levelup">
      <div id="levelup-inner">
        <h2>升级！选择一项强化</h2>
        <div id="levelup-choices"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
