<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>枪械模型预览调试</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #111; color: #eee; }
      #c { width: 100vw; height: 100vh; display: block; }
      #panel {
        position: fixed; right: 12px; top: 12px; width: 280px; max-height: calc(100vh - 24px);
        overflow: auto; background: rgba(20,20,30,0.92); border: 1px solid #333; border-radius: 10px;
        padding: 12px 14px; font-size: 13px; z-index: 10;
      }
      #panel h2 { font-size: 15px; margin-bottom: 10px; color: #5aa9ff; }
      .row { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; }
      .row label { width: 96px; color: #aaa; }
      .row input[type=range] { flex: 1; }
      .row .val { width: 44px; text-align: right; color: #7fe87f; font-family: monospace; }
      .gun-tabs button {
        padding: 6px 10px; margin: 0 4px 8px 0; cursor: pointer; background: #2a2a3a; color: #ddd;
        border: 1px solid #444; border-radius: 6px;
      }
      .gun-tabs button.on { background: #3a7afe; color: #fff; border-color: #5a91ff; }
      #jsonbox {
        width: 100%; height: 130px; margin-top: 8px; background: #0d0d16; color: #9fe89f;
        border: 1px solid #333; border-radius: 6px; font-family: monospace; font-size: 11px; padding: 8px; white-space: pre;
        overflow: auto;
      }
      .hint { color: #888; font-size: 11px; line-height: 1.6; margin-top: 8px; }
      .btn { padding: 6px 12px; cursor: pointer; background: #3a7afe; color: #fff; border: none; border-radius: 6px; margin-top: 6px; }
      .check { display: flex; gap: 6px; align-items: center; margin: 6px 0; color: #ccc; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 5;
        color: rgba(255,255,255,0.8); font-size: 22px; pointer-events: none; text-shadow: 0 0 4px #000;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="crosshair">+</div>
    <div id="panel">
      <h2>枪械模型预览 / 调参</h2>
      <div class="gun-tabs" id="tabs"></div>
      <div class="check"><input type="checkbox" id="fp" checked> 第一人称模拟（脱钩则自由观察）</div>
      <div class="check"><input type="checkbox" id="flip"> 枪口朝前(翻转Y 180°)</div>
      <div class="row"><label>缩放 scale</label><input type="range" id="s" min="0.1" max="1.2" step="0.01" value="0.5"><span class="val" id="s_v">0.50</span></div>
      <div class="row"><label>旋转X rotX</label><input type="range" id="rx" min="-180" max="180" step="1" value="0"><span class="val" id="rx_v">0°</span></div>
      <div class="row"><label>旋转Y rotY</label><input type="range" id="ry" min="-180" max="180" step="1" value="0"><span class="val" id="ry_v">0°</span></div>
      <div class="row"><label>旋转Z rotZ</label><input type="range" id="rz" min="-180" max="180" step="1" value="0"><span class="val" id="rz_v">0°</span></div>
      <div class="row"><label>位置X posX</label><input type="range" id="px" min="-0.4" max="0.4" step="0.01" value="0"><span class="val" id="px_v">0.00</span></div>
      <div class="row"><label>位置Y posY</label><input type="range" id="py" min="-0.4" max="0.4" step="0.01" value="0"><span class="val" id="py_v">0.00</span></div>
      <div class="row"><label>位置Z posZ</label><input type="range" id="pz" min="-0.6" max="0.4" step="0.01" value="0"><span class="val" id="pz_v">0.00</span></div>
      <button class="btn" id="copy">复制当前枪的参数 JSON</button>
      <div>当前参数：</div>
      <div id="jsonbox"></div>
      <div class="hint">鼠标拖动旋转视角观察。参数会即时应用。把“当前参数”里的 JSON 发给我，我写入游戏配置即可。</div>
    </div>
    <script type="module" src="/preview.js"></script>
  </body>
</html>
